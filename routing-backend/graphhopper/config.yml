# GraphHopper 10.2 / Java 21; ordinary pedestrian routing only.
graphhopper:
  datareader.file: /data/campus.osm
  graph.location: /graph-cache
  profiles:
    - name: walking
      custom_model_files: [foot.json]
  profiles_ch:
    - profile: walking
  profiles_lm: []
  graph.encoded_values: foot_access,foot_average_speed,foot_priority,hike_rating,mtb_rating
  # Retain small campus components; disconnected points yield honest no-route errors.
  prepare.min_network_size: 0
  prepare.subnetworks.threads: 1
  prepare.ch.threads: 1
  routing.max_visited_nodes: 50000
  routing.timeout_ms: 8000
  routing.non_ch.max_waypoint_distance: 5000
  routing.snap_preventions_default: ferry
  import.osm.ignored_highways: motorway,trunk
  graph.dataaccess.default_type: RAM_STORE
  datareader.preferred_language: en
server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []
logging:
  level: INFO
  appenders:
    - type: console
      time_zone: UTC
      log_format: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
